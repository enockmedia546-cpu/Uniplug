<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>UNIPLUG | Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/jpeg" href="unlogo.jpg">

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --blue:#2563eb; --sky:#0ea5e9;
  --surface:#111827; --surface2:#1a2332; --card:#131e2e;
  --border:rgba(255,255,255,0.07); --text:#f1f5f9;
  --muted:#64748b; --label:#94a3b8;
  --error:#ef4444; --success:#10b981; --amber:#f59e0b;
  --radius:14px; --topbar-h:60px; --bnav-h:65px;
}

html, body { height:100%; background:#0a0f1a; color:var(--text); font-family:'DM Sans',sans-serif; overflow:hidden; }

/* ═══════ APP SHELL ═══════ */
.app { max-width:480px; margin:0 auto; height:100vh; display:flex; flex-direction:column; background:#0a0f1a; position:relative; }

/* ═══════ TOPBAR ═══════ */
.topbar {
  height:var(--topbar-h); background:rgba(10,15,26,0.96);
  backdrop-filter:blur(16px); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 16px; gap:12px; flex-shrink:0;
}
.topbar-ham { width:36px; height:36px; background:none; border:none; color:var(--text); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:8px; }
.topbar-title { font-family:'Syne',sans-serif; font-size:17px; font-weight:700; flex:1; }
.topbar-right { display:flex; align-items:center; gap:10px; }

.notif-btn { position:relative; cursor:pointer; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(255,255,255,0.05); color:var(--label); font-size:17px; }
.notif-btn:hover { color:var(--sky); }
.notif-badge { position:absolute; top:-2px; right:-2px; background:var(--error); color:white; font-size:9px; font-weight:700; min-width:16px; height:16px; border-radius:10px; padding:0 4px; display:none; align-items:center; justify-content:center; }

.topbar-av { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--sky)); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; overflow:hidden; cursor:pointer; border:2px solid rgba(37,99,235,0.4); }
.topbar-av img { width:100%; height:100%; object-fit:cover; }

/* ═══════ CONTENT ═══════ */
#mainContent { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
#mainContent::-webkit-scrollbar { display:none; }

/* ═══════ BOTTOM NAV ═══════ */
.bottom-nav { height:var(--bnav-h); background:rgba(10,15,26,0.97); border-top:1px solid var(--border); display:flex; align-items:center; flex-shrink:0; padding-bottom:env(safe-area-inset-bottom,0px); }
.bnav-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; padding:8px 0; color:var(--muted); border:none; background:none; font-family:'DM Sans',sans-serif; transition:color 0.2s; }
.bnav-item.active { color:var(--sky); }
.bnav-item .bi { font-size:20px; line-height:1; }
.bnav-item .bl { font-size:10px; font-weight:500; }
.bnav-item.active .bi { filter:drop-shadow(0 0 6px rgba(14,165,233,0.6)); }

/* ═══════ DRAWER ═══════ */
.drawer-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:150; }
.drawer-overlay.show { display:block; }
.drawer { position:fixed; top:0; left:0; width:280px; height:100%; background:#0d1524; border-right:1px solid var(--border); z-index:160; display:flex; flex-direction:column; transform:translateX(-100%); transition:transform 0.3s; }
.drawer.open { transform:translateX(0); }
.drawer-head { padding:48px 20px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; }
.drawer-av { width:54px; height:54px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--sky)); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; overflow:hidden; flex-shrink:0; border:2px solid rgba(37,99,235,0.4); }
.drawer-av img { width:100%; height:100%; object-fit:cover; }
.drawer-name { font-size:15px; font-weight:700; }
.drawer-role { font-size:12px; color:var(--sky); margin-top:2px; }
.drawer-nav { flex:1; overflow-y:auto; padding:12px 0; }
.drawer-sec { font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--muted); padding:12px 20px 5px; }
.drawer-item { display:flex; align-items:center; gap:12px; padding:12px 20px; cursor:pointer; color:var(--label); font-size:14px; transition:all 0.2s; border:none; background:none; width:100%; text-align:left; font-family:'DM Sans',sans-serif; }
.drawer-item:hover { background:rgba(255,255,255,0.04); color:var(--text); }
.drawer-item .di { width:20px; text-align:center; }
.drawer-tag { margin-left:auto; font-size:9px; font-weight:700; padding:2px 7px; border-radius:6px; background:rgba(14,165,233,0.15); color:var(--sky); text-transform:uppercase; }
.drawer-bottom { padding:16px 20px; border-top:1px solid var(--border); }
.drawer-logout { width:100%; padding:12px; border-radius:10px; border:1px solid rgba(239,68,68,0.2); background:rgba(239,68,68,0.08); color:var(--error); font-family:'DM Sans',sans-serif; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }

/* ═══════ NOTIFICATION PANEL ═══════ */
.notif-panel { position:fixed; top:60px; left:0; right:0; max-width:480px; margin:0 auto; max-height:380px; overflow-y:auto; background:#0f1829; border:1px solid var(--border); border-top:none; border-radius:0 0 16px 16px; z-index:100; display:none; box-shadow:0 12px 28px rgba(0,0,0,0.4); }
.notif-panel.show { display:block; }
.notif-item { padding:14px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
.notif-item.unread { background:rgba(37,99,235,0.07); }
.notif-title { font-size:13px; font-weight:600; margin-bottom:3px; }
.notif-msg { font-size:12px; color:var(--muted); }
.notif-time { font-size:10px; color:var(--muted); margin-top:4px; }
.notif-empty { text-align:center; padding:32px; color:var(--muted); font-size:13px; }

/* ═══════ SEARCH ═══════ */
.search-bar { margin:14px 16px; display:flex; align-items:center; gap:10px; position:relative; }
.search-wrap { flex:1; position:relative; }
.search-input { width:100%; padding:12px 14px 12px 40px; border-radius:12px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; }
.search-input:focus { outline:none; border-color:var(--sky); }
.search-input::placeholder { color:var(--muted); }
.search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:14px; }
.filter-btn { width:44px; height:44px; border-radius:12px; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--label); flex-shrink:0; }
.filter-btn:hover { border-color:var(--sky); color:var(--sky); }

/* Global search results dropdown */
.search-results {
  position:absolute; top:calc(100% + 6px); left:0; right:0;
  background:#0f1829; border:1px solid var(--border); border-radius:14px;
  max-height:320px; overflow-y:auto; z-index:90; display:none;
  box-shadow:0 12px 32px rgba(0,0,0,0.45);
}
.search-results.show { display:block; }
.sr-section { padding:10px 14px 4px; font-size:10px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:var(--muted); }
.sr-item { display:flex; align-items:center; gap:12px; padding:10px 14px; cursor:pointer; transition:background 0.15s; }
.sr-item:hover { background:rgba(255,255,255,0.04); }
.sr-icon { width:36px; height:36px; border-radius:10px; background:rgba(14,165,233,0.12); color:var(--sky); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; overflow:hidden; }
.sr-icon img { width:100%; height:100%; object-fit:cover; }
.sr-info { flex:1; min-width:0; }
.sr-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sr-meta { font-size:11px; color:var(--muted); margin-top:2px; }
.sr-empty { padding:20px; text-align:center; color:var(--muted); font-size:13px; }

/* ═══════ SECTION HEADER ═══════ */
.sec-hdr { display:flex; align-items:center; justify-content:space-between; padding:0 16px; margin-bottom:12px; }
.sec-hdr h3 { font-family:'Syne',sans-serif; font-size:15px; font-weight:700; }
.see-all { font-size:13px; color:var(--sky); background:none; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; font-weight:600; }

/* ═══════ ICON GRID ═══════ */
.icon-grid { display:flex; flex-wrap:wrap; gap:10px; padding:0 16px; margin-bottom:22px; }
.icon-item { width:calc(20% - 8px); display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer; }
.icon-box { width:50px; height:50px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:20px; transition:transform 0.18s; }
.icon-item:active .icon-box { transform:scale(0.9); }
.icon-label { font-size:10px; font-weight:500; text-align:center; color:var(--label); line-height:1.25; }

/* Icon box colors */
.ib-blue   { background:rgba(37,99,235,0.2);   border:1px solid rgba(37,99,235,0.3);   color:#60a5fa; }
.ib-amber  { background:rgba(245,158,11,0.18);  border:1px solid rgba(245,158,11,0.3);  color:#fbbf24; }
.ib-sky    { background:rgba(14,165,233,0.18);  border:1px solid rgba(14,165,233,0.3);  color:#38bdf8; }
.ib-green  { background:rgba(16,185,129,0.18);  border:1px solid rgba(16,185,129,0.3);  color:#34d399; }
.ib-purple { background:rgba(139,92,246,0.18);  border:1px solid rgba(139,92,246,0.3);  color:#a78bfa; }
.ib-red    { background:rgba(239,68,68,0.18);   border:1px solid rgba(239,68,68,0.3);   color:#f87171; }
.ib-teal   { background:rgba(20,184,166,0.18);  border:1px solid rgba(20,184,166,0.3);  color:#2dd4bf; }
.ib-gray   { background:rgba(100,116,139,0.18); border:1px solid rgba(100,116,139,0.3); color:#94a3b8; }

/* ═══════ HORIZONTAL BOARDING SCROLL ═══════ */
.h-scroll { display:flex; gap:14px; padding:4px 16px 16px; overflow-x:auto; -webkit-overflow-scrolling:touch; scroll-snap-type:x mandatory; }
.h-scroll::-webkit-scrollbar { display:none; }

.h-card { min-width:210px; max-width:210px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; cursor:pointer; scroll-snap-align:start; transition:transform 0.2s, border-color 0.2s; flex-shrink:0; }
.h-card:active { transform:scale(0.97); }

.h-card-img { width:100%; height:130px; background:var(--surface2); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
.h-card-img img { width:100%; height:100%; object-fit:cover; }
.h-card-badge { position:absolute; top:8px; left:8px; background:var(--blue); color:white; font-size:9px; font-weight:700; padding:3px 8px; border-radius:6px; }
.h-card-fav { position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; font-size:13px; color:white; border:1px solid rgba(255,255,255,0.15); cursor:pointer; z-index:2; transition:all 0.2s; }
.h-card-fav.fav-active { color:#ef4444; background:rgba(239,68,68,0.25); border-color:rgba(239,68,68,0.4); }
.h-card-fav.fav-active i { font-weight:900; }

.h-card-body { padding:11px 12px; }
.h-card-name { font-weight:700; font-size:13px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Info row: price | walk | per room */
.h-card-info { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; margin-top:4px; }
.h-info-tag { display:flex; align-items:center; gap:3px; font-size:10px; color:var(--label); background:rgba(255,255,255,0.05); padding:3px 6px; border-radius:6px; }
.h-info-tag i { font-size:9px; color:var(--sky); }
.h-info-tag.price { color:var(--sky); font-weight:700; background:rgba(14,165,233,0.1); }
.h-info-tag.rating { color:var(--amber); }

/* Amenity icons strip */
.h-card-amenities { display:flex; gap:6px; flex-wrap:wrap; }
.h-amenity-icon { width:24px; height:24px; border-radius:6px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--sky); }

/* ═══════ LISTING DETAIL MODAL ═══════ */
.detail-modal { position:fixed; inset:0; background:#0a0f1a; z-index:300; display:none; flex-direction:column; }
.detail-modal.show { display:flex; }

.detail-topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; position:absolute; top:0; left:0; right:0; z-index:10; background:linear-gradient(to bottom,rgba(0,0,0,0.5),transparent); }
.detail-back-btn { width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.15); color:white; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.detail-topbar-right { display:flex; gap:8px; }
.detail-icon-btn { width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.15); color:white; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.detail-icon-btn.fav-active { color:#ef4444; background:rgba(239,68,68,0.25); border-color:rgba(239,68,68,0.4); }

/* Photo carousel */
.detail-carousel { position:relative; width:100%; height:260px; overflow:hidden; flex-shrink:0; }
.detail-carousel img { width:100%; height:100%; object-fit:cover; transition:opacity 0.3s; }
.carousel-counter { position:absolute; bottom:12px; right:12px; background:rgba(0,0,0,0.6); color:white; font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; }
.carousel-prev, .carousel-next { position:absolute; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.15); color:white; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.carousel-prev { left:10px; }
.carousel-next { right:10px; }

/* Thumbnail strip */
.detail-thumbs { display:flex; gap:6px; padding:8px 14px; background:rgba(10,15,26,0.95); overflow-x:auto; flex-shrink:0; }
.detail-thumbs::-webkit-scrollbar { display:none; }
.detail-thumb { width:60px; height:48px; border-radius:8px; overflow:hidden; cursor:pointer; flex-shrink:0; border:2px solid transparent; transition:border-color 0.2s; }
.detail-thumb.active { border-color:var(--sky); }
.detail-thumb img { width:100%; height:100%; object-fit:cover; }

/* Detail body (scrollable) */
.detail-body { flex:1; overflow-y:auto; padding:16px; background:#0a0f1a; }
.detail-body::-webkit-scrollbar { display:none; }

.detail-name-row { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px; gap:10px; }
.detail-name { font-family:'Syne',sans-serif; font-size:18px; font-weight:800; flex:1; }
.detail-price { font-family:'Syne',sans-serif; font-size:18px; font-weight:800; color:var(--sky); white-space:nowrap; }

.detail-loc-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.detail-loc { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:5px; }
.detail-rating { font-size:12px; color:var(--amber); display:flex; align-items:center; gap:4px; }
.detail-rating span { color:var(--muted); }

/* Amenity pills */
.amenity-pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--border); }
.amenity-pill { display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 14px; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:12px; min-width:64px; }
.amenity-pill i { font-size:18px; color:var(--sky); }
.amenity-pill span { font-size:11px; color:var(--label); font-weight:500; white-space:nowrap; }

/* About */
.detail-about { margin-bottom:20px; }
.detail-about h4 { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; margin-bottom:8px; }
.detail-about p { font-size:13px; color:var(--muted); line-height:1.65; }
.read-more-btn { background:none; border:none; color:var(--sky); font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; margin-top:4px; padding:0; }

/* Reviews section */
.reviews-section { margin-bottom:20px; padding-top:16px; border-top:1px solid var(--border); }
.reviews-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.reviews-header h4 { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; }
.review-card { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; }
.review-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.review-author { font-size:13px; font-weight:600; }
.review-stars { color:var(--amber); font-size:11px; }
.review-text { font-size:13px; color:var(--muted); line-height:1.5; }
.review-reply { margin-top:8px; padding:8px 10px; background:rgba(37,99,235,0.08); border-radius:8px; border-left:3px solid var(--sky); }
.review-reply-label { font-size:10px; color:var(--sky); font-weight:600; margin-bottom:2px; }
.review-reply-text { font-size:12px; color:var(--label); }
.review-form { margin-top:14px; padding:14px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:12px; }
.star-select { display:flex; gap:6px; margin-bottom:10px; }
.star-btn { background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer; transition:color 0.15s; }
.star-btn.active, .star-btn:hover { color:var(--amber); }
.review-textarea { width:100%; min-height:70px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--text); font-family:'DM Sans',sans-serif; font-size:13px; resize:vertical; margin-bottom:10px; }
.review-textarea:focus { outline:none; border-color:var(--sky); }
.review-submit { width:100%; padding:11px; border:none; border-radius:10px; background:linear-gradient(135deg,var(--blue),var(--sky)); color:white; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:700; cursor:pointer; }

/* Bottom action bar */
.detail-actions { display:flex; gap:10px; padding:14px 16px; background:rgba(10,15,26,0.97); border-top:1px solid var(--border); flex-shrink:0; }
.detail-call-btn { flex:1; padding:14px; border-radius:12px; border:1.5px solid var(--border); background:none; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:all 0.2s; }
.detail-call-btn:hover { border-color:var(--sky); color:var(--sky); }
.detail-msg-btn { flex:2; padding:14px; border-radius:12px; border:none; background:linear-gradient(135deg,var(--blue),var(--sky)); color:white; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:transform 0.2s; box-shadow:0 4px 14px rgba(37,99,235,0.35); }
.detail-msg-btn:active { transform:scale(0.98); }

/* ═══════ PAYMENT MODAL (CENTERED) ═══════ */
.payment-modal { position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px); z-index:400; display:none; align-items:center; justify-content:center; padding:16px; }
.payment-modal.show { display:flex; }
.payment-sheet { background:#0d1829; border:1px solid var(--border); border-radius:18px; padding:20px 20px 24px; width:100%; max-width:400px; max-height:85vh; overflow-y:auto; animation:fadeScale 0.25s ease; }
@keyframes fadeScale { from { transform:scale(0.92); opacity:0; } to { transform:none; opacity:1; } }
.pay-handle { display:none; }
.pay-title { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; margin-bottom:4px; }
.pay-sub { font-size:13px; color:var(--muted); margin-bottom:20px; }

.pay-amount-card { background:rgba(37,99,235,0.08); border:1px solid rgba(37,99,235,0.2); border-radius:14px; padding:18px; margin-bottom:18px; text-align:center; }
.pay-amount-label { font-size:12px; color:var(--muted); margin-bottom:6px; }
.pay-amount-val { font-family:'Syne',sans-serif; font-size:32px; font-weight:800; color:var(--sky); }
.pay-number { font-size:13px; color:var(--label); margin-top:6px; }

.pay-steps { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
.pay-step { display:flex; gap:10px; align-items:flex-start; }
.step-num { width:22px; height:22px; border-radius:50%; background:var(--blue); color:white; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
.step-text { font-size:13px; color:var(--label); line-height:1.5; }

.pay-input-label { font-size:12px; color:var(--label); font-weight:500; margin-bottom:6px; display:block; }
.pay-input { width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; margin-bottom:14px; transition:border 0.2s; }
.pay-input:focus { outline:none; border-color:var(--sky); }
.pay-input::placeholder { color:var(--muted); }
.pay-submit-btn { width:100%; padding:15px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--blue),var(--sky)); color:white; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 4px 16px rgba(37,99,235,0.35); }
.pay-cancel-btn { width:100%; padding:12px; border:1px solid var(--border); border-radius:14px; background:none; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:14px; cursor:pointer; margin-top:10px; }

/* Pending state */
.pay-pending-card { background:rgba(245,158,11,0.07); border:1px solid rgba(245,158,11,0.2); border-radius:14px; padding:18px; text-align:center; }
.pay-pending-icon { font-size:2.5rem; margin-bottom:10px; }
.pay-pending-title { font-family:'Syne',sans-serif; font-size:16px; font-weight:700; margin-bottom:6px; }
.pay-pending-text { font-size:13px; color:var(--muted); line-height:1.6; }
.pay-txn-display { font-family:monospace; font-size:12px; background:rgba(255,255,255,0.05); padding:6px 12px; border-radius:8px; margin-top:10px; color:var(--sky); display:inline-block; }

/* Confirmed state */
.pay-confirmed-card { background:rgba(16,185,129,0.07); border:1px solid rgba(16,185,129,0.2); border-radius:14px; padding:20px; }
.contact-detail-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
.contact-detail-row:last-child { border-bottom:none; }
.contact-detail-icon { width:38px; height:38px; border-radius:10px; background:rgba(16,185,129,0.15); color:var(--success); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.contact-detail-text { flex:1; }
.contact-detail-label { font-size:11px; color:var(--muted); margin-bottom:2px; }
.contact-detail-val { font-size:15px; font-weight:700; }
.contact-copy-btn { font-size:13px; color:var(--sky); background:none; border:none; cursor:pointer; }

/* ═══════ EXPLORE ═══════ */
.filter-chips { display:flex; gap:8px; padding:0 16px 12px; overflow-x:auto; }
.filter-chips::-webkit-scrollbar { display:none; }
.chip { padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--label); font-size:12px; font-weight:500; white-space:nowrap; cursor:pointer; transition:all 0.2s; flex-shrink:0; }
.chip.active { background:var(--blue); border-color:var(--blue); color:white; }

.e-list { display:flex; flex-direction:column; gap:12px; padding:0 16px 20px; }
.e-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; display:flex; cursor:pointer; transition:border-color 0.2s; }
.e-card:hover { border-color:rgba(14,165,233,0.3); }
.e-photo { width:110px; min-width:110px; height:120px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:2rem; overflow:hidden; position:relative; }
.e-photo img { width:100%; height:100%; object-fit:cover; }
.e-fav { position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; font-size:12px; color:white; cursor:pointer; z-index:2; transition:all 0.2s; }
.e-fav.fav-active { color:#ef4444; background:rgba(239,68,68,0.25); }
.e-body { flex:1; padding:12px; display:flex; flex-direction:column; justify-content:space-between; min-width:0; }
.e-name { font-weight:700; font-size:14px; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.e-loc { font-size:11px; color:var(--muted); margin-bottom:6px; }
.e-amenities { display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
.e-amenity { font-size:10px; color:var(--label); display:flex; align-items:center; gap:3px; }
.e-amenity i { color:var(--sky); font-size:9px; }
.e-footer { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:4px; }
.e-price { font-family:'Syne',sans-serif; font-size:14px; font-weight:800; color:var(--sky); }
.e-stars { font-size:11px; color:var(--amber); }
.e-dist { font-size:10px; color:var(--muted); background:rgba(255,255,255,0.05); padding:2px 7px; border-radius:10px; }

/* ═══════ FILTERS SHEET (CENTERED) ═══════ */
.sheet-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200; }
.sheet-bg.show { display:block; }
.filters-sheet {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.95);
  width:calc(100% - 32px); max-width:420px; background:#0d1829;
  border-radius:18px; border:1px solid var(--border); padding:0 20px 24px;
  z-index:210; transition:transform 0.25s ease, opacity 0.25s ease;
  max-height:85vh; overflow-y:auto; opacity:0; pointer-events:none;
}
.filters-sheet.show { transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto; }
.sheet-handle { display:none; }
.filter-group { margin-bottom:18px; }
.filter-group label { font-size:13px; color:var(--label); font-weight:600; display:block; margin-bottom:10px; }
.opt-chips { display:flex; flex-wrap:wrap; gap:8px; }
.opt-chip { padding:7px 16px; border-radius:20px; border:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--label); font-size:13px; cursor:pointer; transition:all 0.2s; }
.opt-chip.sel { background:var(--blue); border-color:var(--blue); color:white; }
.amen-chips { display:flex; flex-wrap:wrap; gap:8px; }
.amen-chip { padding:7px 13px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--label); font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.2s; }
.amen-chip.sel { background:rgba(37,99,235,0.15); border-color:var(--blue); color:#60a5fa; }
.apply-btn { width:100%; padding:15px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--blue),var(--sky)); color:white; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:700; cursor:pointer; }
.price-labels { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:8px; }
.price-range { width:100%; accent-color:var(--sky); }

/* ═══════ CHAT ═══════ */
.chat-wrap { display:flex; flex-direction:column; height:calc(100vh - var(--topbar-h) - var(--bnav-h)); }
.chat-msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.chat-msgs::-webkit-scrollbar { display:none; }
.chat-msg { display:flex; gap:8px; align-items:flex-end; }
.chat-msg.own { flex-direction:row-reverse; }
.chat-av { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--sky)); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; overflow:hidden; cursor:pointer; }
.chat-av img { width:100%; height:100%; object-fit:cover; }
.chat-bwrap { max-width:70%; }
.chat-sender { font-size:10px; color:var(--muted); margin-bottom:2px; cursor:pointer; }
.chat-bubble { padding:9px 13px; border-radius:16px; font-size:13px; line-height:1.5; }
.chat-msg:not(.own) .chat-bubble { background:var(--surface2); border:1px solid var(--border); border-bottom-left-radius:4px; }
.chat-msg.own .chat-bubble { background:rgba(37,99,235,0.25); border:1px solid rgba(37,99,235,0.3); border-bottom-right-radius:4px; }
.chat-time { font-size:10px; color:var(--muted); margin-top:3px; text-align:right; }
.chat-bar { display:flex; gap:10px; padding:12px 16px; background:rgba(10,15,26,0.95); border-top:1px solid var(--border); }
.chat-bar input { flex:1; padding:12px 14px; border-radius:24px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; }
.chat-bar input:focus { outline:none; border-color:var(--sky); }
.chat-send { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--sky)); border:none; color:white; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

/* ═══════ SHOP / MARKETPLACE ═══════ */
.tab-bar { display:flex; padding:14px 16px 0; overflow-x:auto; border-bottom:1px solid var(--border); }
.tab-bar::-webkit-scrollbar { display:none; }
.tab-btn { padding:8px 16px; border:none; background:none; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all 0.2s; }
.tab-btn.active { color:var(--sky); border-bottom-color:var(--sky); }

/* Product GRID instead of list */
.product-grid {
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
  padding:14px 16px;
}
.product-card {
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; cursor:pointer; display:flex; flex-direction:column;
  transition:border-color 0.2s, transform 0.15s;
}
.product-card:hover { border-color:rgba(14,165,233,0.3); }
.product-card:active { transform:scale(0.98); }
.product-img {
  width:100%; height:120px; background:var(--surface2);
  display:flex; align-items:center; justify-content:center; font-size:2rem; overflow:hidden;
}
.product-img img { width:100%; height:100%; object-fit:cover; }
.product-info { padding:10px 12px; flex:1; display:flex; flex-direction:column; }
.product-name { font-weight:600; font-size:13px; margin-bottom:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.product-sub { font-size:11px; color:var(--muted); margin-bottom:6px; }
.product-price { font-family:'Syne',sans-serif; font-size:15px; font-weight:800; color:var(--sky); margin-top:auto; }

.sell-fab { position:fixed; bottom:calc(var(--bnav-h) + 16px); right:50%; transform:translateX(calc(50% - 170px)); padding:12px 20px; border-radius:24px; background:linear-gradient(135deg,var(--blue),var(--sky)); color:white; border:none; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px; box-shadow:0 6px 20px rgba(37,99,235,0.4); z-index:40; }

/* ═══════ UPDATES ═══════ */
.update-item { display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.update-item:last-child { border-bottom:none; }
.update-av { width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,var(--blue),var(--sky)); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; font-weight:700; }
.update-body { flex:1; min-width:0; }
.update-title { font-size:14px; font-weight:600; margin-bottom:3px; }
.update-preview { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.update-time { font-size:10px; color:var(--muted); margin-top:4px; }

/* ═══════ PROFILE ═══════ */
.profile-card { margin:16px; padding:20px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); }
.profile-av-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:18px; }
.profile-big-av { width:82px; height:82px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--sky)); display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; overflow:hidden; cursor:pointer; position:relative; border:3px solid rgba(37,99,235,0.4); }
.profile-big-av img { width:100%; height:100%; object-fit:cover; }
.profile-big-av .cam { position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; font-size:20px; color:white; }
.profile-big-av:hover .cam { display:flex; }
.profile-nm { font-family:'Syne',sans-serif; font-size:20px; font-weight:700; text-align:center; }
.role-chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
.role-chip { padding:3px 10px; background:rgba(14,165,233,0.12); border:1px solid rgba(14,165,233,0.2); color:var(--sky); border-radius:20px; font-size:11px; font-weight:500; }
.profile-meta { display:flex; flex-direction:column; gap:8px; padding-top:14px; border-top:1px solid var(--border); margin-top:14px; }
.meta-item { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
.meta-item i { width:16px; color:var(--sky); }
.action-list { margin:0 16px 20px; display:flex; flex-direction:column; gap:10px; }
.action-item { display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; }
.action-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.action-label { flex:1; font-size:14px; font-weight:500; }
.action-arr { color:var(--muted); font-size:12px; }
.action-badge { font-size:11px; font-weight:600; color:var(--success); }
.upload-bar-wrap { height:3px; background:var(--border); border-radius:2px; margin-top:6px; overflow:hidden; display:none; max-width:200px; }
.upload-bar { height:100%; background:linear-gradient(90deg,var(--blue),var(--sky)); transition:width 0.3s; }

/* ═══════ FORMS ═══════ */
input, select, textarea { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; -webkit-appearance:none; }
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--sky); }
input::placeholder { color:var(--muted); }
select option { background:#0d1829; }
textarea { resize:vertical; min-height:80px; }
.form-btn { width:100%; padding:13px; border-radius:12px; border:none; background:linear-gradient(135deg,var(--blue),var(--sky)); color:white; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; }
.form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.form-group label { font-size:12px; color:var(--label); font-weight:500; }

/* Photo upload for sell (max 3) */
.photo-upload-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.photo-slot {
  width:72px; height:72px; border-radius:10px; border:1.5px dashed var(--border);
  background:rgba(255,255,255,0.03); display:flex; align-items:center; justify-content:center;
  cursor:pointer; position:relative; overflow:hidden; font-size:20px; color:var(--muted);
}
.photo-slot img { width:100%; height:100%; object-fit:cover; }
.photo-slot .remove-photo {
  position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%;
  background:rgba(239,68,68,0.9); color:white; font-size:10px; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}

/* ═══════ MISC ═══════ */
.empty-state { text-align:center; padding:48px 20px; color:var(--muted); }
.empty-icon { font-size:3rem; margin-bottom:12px; }
.empty-state h3 { font-size:15px; color:var(--label); margin-bottom:6px; }
.spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--sky); border-radius:50%; animation:spin 0.7s linear infinite; margin:48px auto; }
@keyframes spin { to { transform:rotate(360deg); } }
.badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:10px; font-weight:700; }
.b-blue  { background:rgba(37,99,235,0.15);  color:#60a5fa; }
.b-green { background:rgba(16,185,129,0.15); color:#34d399; }
.b-red   { background:rgba(239,68,68,0.15);  color:#f87171; }
.b-amber { background:rgba(245,158,11,0.15); color:#fbbf24; }

.toast { position:fixed; bottom:calc(var(--bnav-h) + 12px); left:50%; transform:translateX(-50%) translateY(16px); padding:11px 22px; border-radius:50px; font-size:13px; font-weight:500; z-index:999; opacity:0; pointer-events:none; transition:all 0.3s; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.error   { background:#dc2626; color:white; }
.toast.success { background:var(--success); color:white; }
.toast.info    { background:var(--blue); color:white; }
.toast.warn    { background:var(--amber); color:#000; }

/* General modal (CENTERED) */
.gen-modal { position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(6px); z-index:350; display:none; align-items:center; justify-content:center; padding:16px; }
.gen-modal.show { display:flex; }
.gen-sheet { background:#0d1829; border:1px solid var(--border); border-radius:18px; padding:20px 20px 24px; width:100%; max-width:400px; max-height:85vh; overflow-y:auto; animation:fadeScale 0.25s ease; }
.gen-handle { display:none; }
.gen-title { font-family:'Syne',sans-serif; font-size:17px; font-weight:700; margin-bottom:4px; }
.gen-sub { font-size:13px; color:var(--muted); margin-bottom:16px; }

/* ═══════ RESPONSIVE ═══════ */
@media (min-width:480px) {
  .sell-fab { right:auto; left:50%; transform:translateX(120px); }
  .sell-fab:hover { transform:translateX(120px) translateY(-2px); }
  .notif-panel { left:50%; transform:translateX(-50%); width:100%; }
}

@media (min-width:640px) {
  .app { max-width:640px; }
  .icon-item { width:calc(12.5% - 8px); }
  .product-grid { grid-template-columns:repeat(3, 1fr); }
  .h-card { min-width:230px; max-width:230px; }
  .e-photo { width:130px; min-width:130px; height:140px; }
}

@media (min-width:768px) {
  .app { max-width:720px; }
  .product-grid { grid-template-columns:repeat(3, 1fr); gap:14px; }
  .icon-grid { gap:14px; }
  .icon-box { width:56px; height:56px; font-size:22px; }
  .detail-carousel { height:320px; }
  .payment-sheet, .gen-sheet { max-width:440px; }
  .filters-sheet { max-width:460px; }
}

@media (min-width:1024px) {
  .app { max-width:900px; box-shadow:0 0 0 1px var(--border); }
  .product-grid { grid-template-columns:repeat(4, 1fr); }
  .h-scroll { padding-left:20px; padding-right:20px; }
  .search-bar, .sec-hdr, .icon-grid, .e-list, .product-grid { padding-left:20px; padding-right:20px; }
}

@media (min-width:1280px) {
  .app { max-width:1024px; }
  .product-grid { grid-template-columns:repeat(4, 1fr); }
}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <button class="topbar-ham" onclick="openDrawer()"><i class="fas fa-bars"></i></button>
    <div class="topbar-title" id="topbarTitle">Dashboard</div>
    <div class="topbar-right">
      <div class="notif-btn" onclick="toggleNotif()">
        <i class="fas fa-bell"></i>
        <span class="notif-badge" id="notifBadge"></span>
      </div>
      <div class="topbar-av" id="topbarAv" onclick="goTo('profile')">U</div>
    </div>
  </div>

  <div id="mainContent"><div class="spinner"></div></div>

  <nav class="bottom-nav">
    <button class="bnav-item active" id="bnav-home"    onclick="goTo('home')">    <span class="bi"><i class="fas fa-home"></i></span>    <span class="bl">Home</span></button>
    <button class="bnav-item"        id="bnav-explore" onclick="goTo('explore')"> <span class="bi"><i class="fas fa-search"></i></span>   <span class="bl">Explore</span></button>
    <button class="bnav-item"        id="bnav-chat"    onclick="goTo('chat')">    <span class="bi"><i class="fas fa-comments"></i></span> <span class="bl">Chat</span></button>
    <button class="bnav-item"        id="bnav-wallet"  onclick="goTo('wallet')">  <span class="bi"><i class="fas fa-store"></i></span>    <span class="bl">Shop</span></button>
    <button class="bnav-item"        id="bnav-profile" onclick="goTo('profile')"> <span class="bi"><i class="fas fa-user"></i></span>     <span class="bl">Profile</span></button>
  </nav>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-av" id="drawerAv">U</div>
    <div><div class="drawer-name" id="drawerName">Loading...</div><div class="drawer-role" id="drawerRole">—</div></div>
  </div>
  <div class="drawer-nav" id="drawerNav"></div>
  <div class="drawer-bottom">
    <button class="drawer-logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>
</div>

<!-- NOTIFICATION PANEL -->
<div class="notif-panel" id="notifPanel">
  <div class="notif-empty"><i class="fas fa-bell-slash"></i> No notifications</div>

// ── Cloudinary upload ──────────────────────────
async function uploadToCloudinary(file, onProgress) {
  const fd = new FormData();
  fd.append("file", file);
  fd.append("upload_preset", PRESET);
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`);
    xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100)); };
    xhr.onload = () => { const d=JSON.parse(xhr.responseText); d.secure_url?resolve(d.secure_url):reject(new Error(d.error?.message||"Upload failed")); };
    xhr.onerror = () => reject(new Error("Network error"));
    xhr.send(fd);
  });
}

// ── Auth Guard ─────────────────────────────────
onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = "login.html"; return; }
  currentUser = user;
  try {
    const snap = await getDoc(doc(db,"users",user.uid));
    if (!snap.exists()) { window.location.href = "login.html"; return; }
    userData = snap.data();
    if (!userData.additionalRoles) {
      await updateDoc(doc(db,"users",user.uid), { additionalRoles:[] });
      userData.additionalRoles = [];
    }
    // Load favourites from localStorage
    userFavourites = JSON.parse(localStorage.getItem(`favs_${user.uid}`) || "[]");
    initApp();
  } catch(e) { showToast("Connection error. Please refresh.","error"); }
});

// ── Notifications ──────────────────────────────
function loadNotifications() {
  if (notifUnsub) notifUnsub();
  const q = query(collection(db,"broadcasts"), orderBy("createdAt","desc"), limit(50));
  notifUnsub = onSnapshot(q, snap => {
    const read = JSON.parse(localStorage.getItem(`rn_${currentUser.uid}`)||"[]");
    const notifs = snap.docs.map(d=>({ id:d.id,...d.data(), time:d.data().createdAt?.toDate()||new Date(), read:read.includes(d.id) }));
    unreadCount = notifs.filter(n=>!n.read).length;
    const badge = document.getElementById("notifBadge");
    if (badge) { badge.textContent = unreadCount>99?"99+":unreadCount; badge.style.display = unreadCount>0?"flex":"none"; }
    const panel = document.getElementById("notifPanel"); if (!panel) return;
    panel.innerHTML = !notifs.length
      ? `<div class="notif-empty"><i class="fas fa-bell-slash"></i> No notifications</div>`
      : notifs.map(n=>`<div class="notif-item ${!n.read?"unread":""}" onclick="markRead('${n.id}')">
          <div class="notif-title"><i class="fas fa-bullhorn"></i> ${esc(n.title||"Broadcast")}</div>
          <div class="notif-msg">${esc((n.message||"").slice(0,80))}${(n.message||"").length>80?"...":""}</div>
          <div class="notif-time">${timeAgo(n.time)}</div>
        </div>`).join("");
  });
}

window.markRead = id => {
  const read = JSON.parse(localStorage.getItem(`rn_${currentUser.uid}`)||"[]");
  if (!read.includes(id)) { read.push(id); localStorage.setItem(`rn_${currentUser.uid}`,JSON.stringify(read)); }
  loadNotifications();
};

    if (!window._listings.length) { el.innerHTML=`<div class="empty-state" style="width:280px;padding:24px;"><p style="color:var(--muted);">No listings yet</p></div>`; return; }

    el.innerHTML = window._listings.map(l => {

      const amenRender = buildSmallAmenities(l.amenities||[]);

    return `<div class="h-amenity-icon" title="${found.label}"><i class="${found.icon}"></i></div>`;
  }).join("");
}

//  GLOBAL SEARCH (listings + products, case-insensitive)
// ══════════════════════════════════════════════
window.globalSearch = function(val) {
  const resultsEl = document.getElementById("searchResults");
  if (!resultsEl) return;

  const q = (val||"").trim().toLowerCase();
  if (!q) {
    resultsEl.classList.remove("show");
    resultsEl.innerHTML = "";
    return;
  }

  const listings = (window._listings||[]).filter(l => {
    const hay = `${l.brandName||""} ${l.area||""} ${l.description||""} ${l.ownerName||""}`.toLowerCase();
    return hay.includes(q);
  }).slice(0, 6);

  const products = (window._products||[]).filter(p => {
    const hay = `${p.name||""} ${p.category||""} ${p.description||""} ${p.location||""} ${p.sellerName||""}`.toLowerCase();
    return hay.includes(q);
  }).slice(0, 6);

  if (!listings.length && !products.length) {
    resultsEl.innerHTML = `<div class="sr-empty"><i class="fas fa-search"></i> No results for "${esc(val)}"</div>`;
    resultsEl.classList.add("show");
    return;
  }

  let html = "";
  if (listings.length) {
    html += `<div class="sr-section">Boarding Houses</div>`;

function buildAmenityPills(l) {
  const pills = [];
  if (l.bedspaces) pills.push({ icon:"fas fa-bed", label:`${l.bedspaces} Beds` });
  if (l.bathrooms) pills.push({ icon:"fas fa-shower", label:`${l.bathrooms} Baths` });
  (l.amenities||[]).forEach(a => {
    const found = AMENITIES.find(x=>x.val===a);
    if (found) pills.push({ icon:found.icon, label:found.label });
  });
  return pills.map(p=>`
    <div class="amenity-pill">
      <i class="${p.icon}"></i>
      <span>${p.label}</span>
    </div>`).join("");
}

async function loadReviews(listingId) {
  const el = document.getElementById("reviewsList");
  if (!el) return;
  try {
    const q = query(collection(db,"reviews"), where("listingId","==",listingId), orderBy("createdAt","desc"));
    const snap = await getDocs(q);
    if (snap.empty) {
      el.innerHTML = `<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px;">No reviews yet. Be the first!</div>`;
      return;
    }
    const isLandlord = detailListing?.ownerId === currentUser?.uid ||
      (userData.role === "Landlord" || (userData.additionalRoles||[]).includes("Landlord"));

    el.innerHTML = snap.docs.map(d => {
      const r = d.data();
      const stars = "★".repeat(r.rating||0) + "☆".repeat(5-(r.rating||0));
      const canReply = isLandlord && !r.reply;
      return `
        <div class="review-card">
          <div class="review-top">
            <div class="review-author">${esc(r.userName||"Student")}</div>
            <div class="review-stars">${stars}</div>
          </div>
          <div class="review-text">${esc(r.text||"")}</div>
          ${r.reply ? `
            <div class="review-reply">
              <div class="review-reply-label">Landlord reply</div>
              <div class="review-reply-text">${esc(r.reply)}</div>
            </div>` : ""}
          ${canReply ? `
            <div style="margin-top:8px;">
              <input id="replyInput_${d.id}" placeholder="Write a reply..." style="padding:8px 10px;font-size:12px;margin-bottom:6px;">
              <button onclick="replyToReview('${d.id}')" style="font-size:12px;padding:6px 12px;border-radius:8px;border:none;background:var(--blue);color:white;cursor:pointer;">Reply</button>
            </div>` : ""}
          <div style="font-size:10px;color:var(--muted);margin-top:6px;">${timeAgo(r.createdAt?.toDate())}</div>
        </div>`;
    }).join("");
  } catch(e) {
    // Fallback if composite index missing – try without orderBy
    try {
      const q2 = query(collection(db,"reviews"), where("listingId","==",listingId));
      const snap2 = await getDocs(q2);
      if (snap2.empty) {
        el.innerHTML = `<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px;">No reviews yet. Be the first!</div>`;
        return;
      }
      const docs = snap2.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
      el.innerHTML = docs.map(r => {
        const stars = "★".repeat(r.rating||0) + "☆".repeat(5-(r.rating||0));
        return `
          <div class="review-card">
            <div class="review-top">
              <div class="review-author">${esc(r.userName||"Student")}</div>
              <div class="review-stars">${stars}</div>
            </div>
            <div class="review-text">${esc(r.text||"")}</div>
            ${r.reply ? `<div class="review-reply"><div class="review-reply-label">Landlord reply</div><div class="review-reply-text">${esc(r.reply)}</div></div>` : ""}
            <div style="font-size:10px;color:var(--muted);margin-top:6px;">${timeAgo(r.createdAt?.toDate?.())}</div>
          </div>`;
      }).join("");
    } catch(err) {
      el.innerHTML = `<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px;">Could not load reviews</div>`;
    }
  }
}

window.submitReview = async function() {
  if (!currentUser || !detailListing) return;
  if (selectedStars < 1) { showToast("Please select a rating","warn"); return; }
  const text = document.getElementById("reviewText")?.value?.trim() || "";
  if (!text) { showToast("Please write a review","warn"); return; }

  // Prevent duplicate reviews from same user
  try {
    const existing = await getDocs(query(
      collection(db,"reviews"),
      where("listingId","==",detailListing.id),
      where("userId","==",currentUser.uid)
    ));
    if (!existing.empty) {
      showToast("You already reviewed this listing","warn");
      return;
    }
  } catch(e) {}

  try {
    await addDoc(collection(db,"reviews"), {
      listingId: detailListing.id,
      landlordId: detailListing.ownerId || null,
      userId: currentUser.uid,
      userName: userData.fullName || "Student",
      rating: selectedStars,
      text,
      reply: null,
      createdAt: serverTimestamp()
    });

    // Recalculate listing average rating
    await recalculateListingRating(detailListing.id);

    // Update landlord overall average
    if (detailListing.ownerId) {
      await recalculateLandlordRating(detailListing.ownerId);
    }

    showToast("Review submitted! ✅","success");
    selectedStars = 0;
    document.getElementById("reviewText").value = "";
    document.querySelectorAll("#starSelect .star-btn").forEach(btn => {
      btn.classList.remove("active");
      btn.querySelector("i").className = "far fa-star";
    });
    loadReviews(detailListing.id);

    // Refresh listing data in memory
    const snap = await getDoc(doc(db,"listings",detailListing.id));
    if (snap.exists()) {
      detailListing = { id:snap.id, ...snap.data() };
      const ratingEl = document.querySelector(".detail-rating");
      if (ratingEl && detailListing.rating) {
        ratingEl.innerHTML = `<i class="fas fa-star"></i> ${Number(detailListing.rating).toFixed(1)} <span>(${detailListing.reviewCount||0} review${(detailListing.reviewCount||0)!==1?"s":""})</span>`;
      }
    }
  } catch(err) {
    showToast("Error: "+err.message,"error");
  }
};

async function recalculateListingRating(listingId) {
  try {
    const snap = await getDocs(query(collection(db,"reviews"), where("listingId","==",listingId)));
    if (snap.empty) {
      await updateDoc(doc(db,"listings",listingId), { rating: 0, reviewCount: 0 });
      return;
    }
    let sum = 0;
    snap.docs.forEach(d => { sum += (d.data().rating || 0); });
    const avg = sum / snap.size;
    await updateDoc(doc(db,"listings",listingId), {
      rating: Math.round(avg * 10) / 10,
      reviewCount: snap.size
    });
  } catch(e) { console.warn("Rating recalc failed", e); }
}

async function recalculateLandlordRating(landlordId) {
  try {
    // Average across all their listings that have ratings
    const listingsSnap = await getDocs(query(collection(db,"listings"), where("ownerId","==",landlordId)));
    let totalRating = 0, count = 0;
    listingsSnap.docs.forEach(d => {
      const data = d.data();
      if (data.rating && data.reviewCount > 0) {
        totalRating += data.rating * data.reviewCount;
        count += data.reviewCount;
      }
    });
    const avg = count > 0 ? Math.round((totalRating / count) * 10) / 10 : 0;
    await updateDoc(doc(db,"users",landlordId), {
      landlordAvgRating: avg,
      landlordReviewCount: count
    });
  } catch(e) { console.warn("Landlord rating recalc failed", e); }
}

window.toggleCardFav = function(listingId, btnEl) {
  const idx = userFavourites.indexOf(listingId);
  if (idx >= 0) {
    userFavourites.splice(idx, 1);
    showToast("Removed from favourites","info");
  } else {
    userFavourites.push(listingId);
    showToast("Added to favourites","success");
  }
  saveFavourites();

  // Update the clicked button
  if (btnEl) {
    const active = isFav(listingId);
    btnEl.classList.toggle("fav-active", active);
    const icon = btnEl.querySelector("i");
    if (icon) icon.className = active ? "fas fa-heart" : "far fa-heart";
  }

  // Sync detail fav button if open
  if (detailListing && detailListing.id === listingId) {
    const dBtn = document.getElementById("detailFavBtn");
    if (dBtn) {
      dBtn.className = `detail-icon-btn ${favBtnClass(listingId)}`;
      dBtn.innerHTML = `<i class="${favIconClass(listingId)}"></i>`;
    }
  }

  // Refresh home cards if visible
  if (activeTab === "home") {
    const scroll = document.getElementById("boardingScroll");
    if (scroll && window._listings) {
      // just update fav icons without full re-render
      scroll.querySelectorAll(".h-card-fav").forEach(btn => {
        const onclick = btn.getAttribute("onclick") || "";
        const match = onclick.match(/toggleCardFav\('([^']+)'/);
        if (match) {
          const id = match[1];
          btn.classList.toggle("fav-active", isFav(id));
          const icon = btn.querySelector("i");
          if (icon) icon.className = favIconClass(id);
        }
      });
    }
  }
  if (activeTab === "explore") renderListings();
};

window.handleContact = async function(type) {
  if (!currentUser) { showToast("Please login to contact landlords.","warn"); return; }
  detailContactType = type;

  const listingId  = detailListing?.id;
  const landlordId = detailListing?.ownerId;

  // 1. Check if already confirmed
  const confirmedQ = query(
    collection(db,"contactRequests"),
    where("userId","==",currentUser.uid),
    where("listingId","==",listingId),
    where("status","==","confirmed")
  );
  const confirmedSnap = await getDocs(confirmedQ);

  if (!confirmedSnap.empty) {
    showConfirmedContacts(confirmedSnap.docs[0].data());
    return;
  }

  // 2. Check if pending
  const pendingQ = query(
    collection(db,"contactRequests"),
    where("userId","==",currentUser.uid),
    where("listingId","==",listingId),
    where("status","==","pending")
  );
  const pendingSnap = await getDocs(pendingQ);

  if (!pendingSnap.empty) {
    showPendingState(pendingSnap.docs[0].data());
    return;
  }

  // 3. Show payment modal
  showPaymentRequest(listingId, landlordId);
};

window.renderListings = function() {
  const s = (document.getElementById("exploreSearch")?.value||"").toLowerCase();
  let list = window._listings||[];
  if (s) list = list.filter(l=>(`${l.brandName||""}${l.area||""}${l.description||""}`).toLowerCase().includes(s));
  if (filterState.price<5000) list = list.filter(l=>(l.price||0)<=filterState.price);
  if (filterState.beds!=="any") { const b=filterState.beds; if(b==="4+") list=list.filter(l=>(l.bedspaces||0)>=4); else list=list.filter(l=>String(l.bedspaces||"")===b); }
  if (filterState.gender!=="any") list = list.filter(l=>(l.gender||"").toLowerCase()===filterState.gender);

  const el = document.getElementById("exploreList"); if (!el) return;
  if (!list.length) { el.innerHTML=`<div class="empty-state"><div class="empty-icon"><i class="fas fa-building"></i></div><h3>No listings found</h3><p>Try adjusting your filters.</p></div>`; return; }

  el.innerHTML = list.map(l => {
    const amenRow = (l.amenities||[]).slice(0,4).map(a=>{
      const f = AMENITIES.find(x=>x.val===a); if(!f) return "";
      return `<div class="e-amenity"><i class="${f.icon}"></i> ${f.label}</div>`;
    }).join("");
    return `
      <div class="e-card" onclick="openListingDetail('${l.id}')">
        <div class="e-photo">
          ${l.photos?.[0]?`<img src="${l.photos[0]}" alt="" loading="lazy">`:`<i class="fas fa-building" style="opacity:0.3;color:var(--sky);"></i>`}
          <div class="e-fav ${favBtnClass(l.id)}" onclick="event.stopPropagation();toggleCardFav('${l.id}',this)"><i class="${favIconClass(l.id)}"></i></div>
        </div>
        <div class="e-body">
          <div class="e-name">${esc(l.brandName||"Boarding House")}</div>
          <div class="e-loc"><i class="fas fa-map-marker-alt" style="color:var(--sky);font-size:10px;"></i> ${esc(l.area||"Near CBU")}</div>
          <div class="e-amenities">${amenRow}</div>
          <div class="e-footer">
            <div class="e-price">K${Number(l.price||0).toLocaleString()}<span style="font-size:10px;color:var(--muted);font-family:'DM Sans';font-weight:400;">/mo</span></div>
            ${l.rating?`<div class="e-stars"><i class="fas fa-star"></i> ${Number(l.rating).toFixed(1)}</div>`:""}
            ${l.distance?`<div class="e-dist">${esc(l.distance)}</div>`:""}

  }).join("");
};

function canSell() {
  const roles = [userData.role, ...(userData.additionalRoles||[])];
  return roles.includes("Entrepreneur") || roles.includes("Admin");
}

window.openSellModal = function() {
  if (!canSell()) {
    openGenModal(`
      <div style="text-align:center;padding:8px 0;">
        <div style="font-size:2.5rem;margin-bottom:12px;">🏪</div>
        <div class="gen-title">Entrepreneur Role Required</div>

        <button class="form-btn" onclick="closeGenModal();openRequestRoleModal()"><i class="fas fa-user-plus"></i> Request Entrepreneur Role</button>
      </div>`);
    return;
  }

  pendingSellPhotos = [];
  openGenModal(`
    <div class="gen-title">Sell on Campus</div>
    <div class="gen-sub">List your product for other students (max 3 photos)</div>
    <div class="form-group"><label>Product name *</label><input id="sName" placeholder="e.g. A4 Notebook"></div>
    <div class="form-group"><label>Price (ZMW) *</label><input id="sPrice" type="number" placeholder="e.g. 35"></div>
    <div class="form-group"><label>Category</label><input id="sCat" placeholder="Books, Electronics, Clothes..."></div>
    <div class="form-group"><label>Location *</label><input id="sLoc" placeholder="e.g. Room 14B, Male Hostel"></div>
    <div class="form-group"><label>Description</label><textarea id="sDesc" rows="3" placeholder="Condition, details..."></textarea></div>
    <div class="form-group">
      <label>Photos (max 3)</label>
      <div class="photo-upload-row" id="photoSlots">
        <div class="photo-slot" onclick="document.getElementById('sellPhotoInput').click()"><i class="fas fa-plus"></i></div>
      </div>
      <input type="file" id="sellPhotoInput" accept="image/*" style="display:none" onchange="addSellPhoto(event)">
    </div>
    <button class="form-btn" onclick="submitProduct()"><i class="fas fa-check"></i> List Product</button>`);
};

window.addSellPhoto = function(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  if (pendingSellPhotos.length >= 3) {
    showToast("Maximum 3 photos allowed","warn");
    e.target.value = "";
    return;
  }
  pendingSellPhotos.push(file);
  renderPhotoSlots();
  e.target.value = "";
};

function renderPhotoSlots() {
  const container = document.getElementById("photoSlots");
  if (!container) return;
  let html = pendingSellPhotos.map((f,i) => {
    const url = URL.createObjectURL(f);
    return `<div class="photo-slot"><img src="${url}" alt=""><button class="remove-photo" onclick="removeSellPhoto(${i})"><i class="fas fa-times"></i></button></div>`;
  }).join("");
  if (pendingSellPhotos.length < 3) {
    html += `<div class="photo-slot" onclick="document.getElementById('sellPhotoInput').click()"><i class="fas fa-plus"></i></div>`;
  }
  container.innerHTML = html;
}

window.removeSellPhoto = function(idx) {
  pendingSellPhotos.splice(idx, 1);
  renderPhotoSlots();
};

window.submitProduct = async function() {
  const name=document.getElementById("sName")?.value?.trim();
  const price=parseFloat(document.getElementById("sPrice")?.value)||0;
  const loc=document.getElementById("sLoc")?.value?.trim();
  if (!name||!price||!loc) { showToast("Please fill required fields.","warn"); return; }

  const btn = document.querySelector(".form-btn");
  if (btn) { btn.disabled = true; btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Uploading...`; }

  try {
    const photoUrls = [];
    for (const file of pendingSellPhotos.slice(0, 3)) {
      const url = await uploadToCloudinary(file);
      photoUrls.push(url);
    }

    await addDoc(collection(db,"products"), {
      name,
      price,
      location: loc,
      category: document.getElementById("sCat")?.value?.trim() || "General",
      description: document.getElementById("sDesc")?.value?.trim() || "",
      available: true,
      sellerId: currentUser.uid,
      sellerName: userData.fullName,
      photos: photoUrls,
      createdAt: serverTimestamp()
    });
    pendingSellPhotos = [];
    closeGenModal();
    showToast("Product listed! ✅","success");
  } catch(err) {
    showToast("Error: "+err.message,"error");
    if (btn) { btn.disabled = false; btn.innerHTML = `<i class="fas fa-check"></i> List Product`; }
  }
};

  await updateDoc(doc(db,"users",currentUser.uid),upd);
  Object.assign(userData,upd); updateTopbarAv();
  closeGenModal(); showToast("Profile updated! ✅","success"); renderProfile();
};

window.showChangePw = function() {
  openGenModal(`
    <div class="gen-title">Change Password</div>
    <div class="form-group"><label>New Password</label><input id="newPw" type="password" placeholder="Min 6 characters"></div>
    <div class="form-group"><label>Confirm Password</label><input id="confPw" type="password" placeholder="Re-enter password"></div>
    <button class="form-btn" onclick="changePw()">Update Password</button>`);
};

window.changePw = function() {
  const pw=document.getElementById("newPw")?.value; const cpw=document.getElementById("confPw")?.value;
  if (pw!==cpw) { showToast("Passwords don't match."); return; }
  if (pw.length<6) { showToast("Min 6 characters."); return; }
  import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js").then(({updatePassword})=>{
    updatePassword(currentUser,pw).then(()=>{ closeGenModal(); showToast("Password updated! ✅","success"); }).catch(err=>showToast(err.message,"error"));
  });
};

window.uploadAvatar = async function(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{ const av=document.querySelector(".profile-big-av"); if(av) av.innerHTML=`<img src="${ev.target.result}"><div class="cam"><i class="fas fa-camera"></i></div>`; };
  reader.readAsDataURL(file);
  document.getElementById("avBarWrap").style.display="block";
  document.getElementById("avStatus").textContent="Uploading...";
  try {
    const url=await uploadToCloudinary(file, pct=>{ document.getElementById("avBar").style.width=pct+"%"; });
    await updateDoc(doc(db,"users",currentUser.uid),{photoURL:url}); userData.photoURL=url; updateTopbarAv();
    document.getElementById("avStatus").textContent="✅ Photo updated!";
    setTimeout(()=>{ document.getElementById("avBarWrap").style.display="none"; document.getElementById("avStatus").textContent=""; },2500);
    showToast("Photo updated! ✅","success");
  } catch(err) { document.getElementById("avStatus").textContent="❌ Upload failed."; showToast("Upload failed: "+err.message,"error"); }
  e.target.value="";
};

window.openRequestRoleModal = function() {
  const current=[userData.role,...(userData.additionalRoles||[])];
  const avail=["Landlord","Entrepreneur","Class Representative","Student Leader"].filter(r=>!current.includes(r));
  if (!avail.length) { showToast("You already have all roles!","info"); return; }
  openGenModal(`
    <div class="gen-title">Request Additional Role</div>
    <div class="gen-sub">Admin will review your request.</div>
    <div class="form-group"><label>Role</label><select id="reqRole">${avail.map(r=>`<option value="${r}">${r}</option>`).join("")}</select></div>
    <div class="form-group"><label>Reason (optional)</label><textarea id="reqReason" rows="3" placeholder="Why are you requesting this role?"></textarea></div>
    <button class="form-btn" onclick="submitRoleReq()"><i class="fas fa-paper-plane"></i> Submit Request</button>`);
};

window.submitRoleReq = async function() {
  const role=document.getElementById("reqRole")?.value; if (!role) return;
  await addDoc(collection(db,"roleRequests"),{ userId:currentUser.uid, userName:userData.fullName, userEmail:userData.email, requestedRole:role, reason:document.getElementById("reqReason")?.value||"", status:"pending", createdAt:serverTimestamp() });
  closeGenModal(); showToast(`Request for ${role} submitted! ✅`,"success");
};

window.viewUserProfile = async function(uid, name) {
  if (!uid) return;
  try {
    const snap=await getDoc(doc(db,"users",uid)); if (!snap.exists()) return;
    const u=snap.data(); const ini=initials(u.fullName||name);
    const landlordRating = u.landlordAvgRating
      ? `<div style="font-size:13px;color:var(--muted);"><i class="fas fa-star" style="color:var(--amber);width:16px;"></i> ${Number(u.landlordAvgRating).toFixed(1)} (${u.landlordReviewCount||0} reviews)</div>`
      : "";
    openGenModal(`
      <div style="text-align:center;">
        <div style="width:64px;height:64px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(135deg,var(--blue),var(--sky));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;overflow:hidden;">
          ${u.photoURL?`<img src="${u.photoURL}" style="width:100%;height:100%;object-fit:cover;">`:`<span>${ini}</span>`}
        </div>
        <div style="font-size:18px;font-weight:700;margin-bottom:4px;">${esc(u.fullName||name)}</div>
        <div style="font-size:13px;color:var(--sky);margin-bottom:16px;">${esc(u.role||"Student")}</div>
        <div style="text-align:left;display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--border);">
          ${u.school ?`<div style="font-size:13px;color:var(--muted);"><i class="fas fa-university" style="color:var(--sky);width:16px;"></i> ${esc(u.school)}</div>`:""}
          ${u.program?`<div style="font-size:13px;color:var(--muted);"><i class="fas fa-book" style="color:var(--sky);width:16px;"></i> ${esc(u.program)}</div>`:""}
          ${u.year   ?`<div style="font-size:13px;color:var(--muted);"><i class="fas fa-calendar-alt" style="color:var(--sky);width:16px;"></i> Year ${u.year}</div>`:""}
          ${landlordRating}
        </div>
      </div>`);
  } catch(err) { showToast("Could not load profile","error"); }
};

window.showComingSoon = function(name) {
  openGenModal(`
    <div style="text-align:center;padding:16px 0;">
      <div style="font-size:3rem;margin-bottom:14px;">🚀</div>
      <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:8px;">${name}</div>
      <div style="font-size:13px;color:var(--muted);">This feature is coming soon to Uniplug CBU. Stay tuned!</div>
    </div>`);
};

window.openFilters = function() {
  document.getElementById("sheetBg").classList.add("show");
  document.getElementById("filtersSheet").classList.add("show");
};
window.closeFilters = function() {
  document.getElementById("sheetBg").classList.remove("show");
  document.getElementById("filtersSheet").classList.remove("show");
};
window.updatePriceLabel = function(val) {
  document.getElementById("priceValLbl").textContent = val>=5000?"K5,000+":"K"+Number(val).toLocaleString();
};
window.selChip = function(el, group) {
  document.querySelectorAll(`.opt-chip[data-f="${group}"]`).forEach(c=>c.classList.remove("sel"));
  el.classList.add("sel");
};
window.toggleAmen = function(el) { el.classList.toggle("sel"); };
window.resetFilters = function() {
  filterState={price:5000,beds:"any",gender:"any",amenities:[]};
  document.getElementById("priceRange").value=5000; updatePriceLabel(5000);
  document.querySelectorAll(".opt-chip").forEach(c=>c.classList.toggle("sel",c.dataset.v==="any"));
  document.querySelectorAll(".amen-chip").forEach(c=>c.classList.remove("sel"));
};
window.applyFilters = function() {
  filterState.price  = parseInt(document.getElementById("priceRange").value)||5000;
  filterState.beds   = document.querySelector(".opt-chip[data-f='beds'].sel")?.dataset.v||"any";
  filterState.gender = document.querySelector(".opt-chip[data-f='gender'].sel")?.dataset.v||"any";
  filterState.amenities=[...document.querySelectorAll(".amen-chip.sel")].map(c=>c.dataset.a);
  closeFilters();
  if (activeTab==="explore") renderListings();
  showToast("Filters applied","info");
};

function ibox(label,val) {
  return `<div style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:11px;">
    <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">${label}</div>
    <div style="font-size:14px;font-weight:600;">${val}</div>
  </div>`;
}

function initials(name="U") { return name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase(); }

function timeAgo(date) {
  if (!date) return "";
  const s=Math.floor((Date.now()-date.getTime())/1000);
  if(s<60) return "Just now"; if(s<3600) return `${Math.floor(s/60)}m ago`;
  if(s<86400) return `${Math.floor(s/3600)}h ago`; return `${Math.floor(s/86400)}d ago`;
}

function esc(str="") {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

window.showToast = function(msg,type="info") {
  const t=document.getElementById("toast"); t.textContent=msg; t.className=`toast show ${type}`;
  setTimeout(()=>t.className="toast",3200);
};

window.openGenModal = function(html) {
  document.getElementById("genContent").innerHTML=html;
  document.getElementById("genModal").classList.add("show");
};
window.closeGenModal = function() {
  document.getElementById("genModal").classList.remove("show");
};

window.toggleNotif = function() { document.getElementById("notifPanel").classList.toggle("show"); };
window.openDrawer  = function() { document.getElementById("drawer").classList.add("open"); document.getElementById("drawerOverlay").classList.add("show"); };
window.closeDrawer = function() { document.getElementById("drawer").classList.remove("open"); document.getElementById("drawerOverlay").classList.remove("show"); };

window.handleLogout = async function() {
  await signOut(auth);
  localStorage.clear();
  window.location.href = "login.html";
};

document.addEventListener("click", e => {
  const panel=document.getElementById("notifPanel");
  if (!e.target.closest(".notif-btn")&&!e.target.closest(".notif-panel")) panel?.classList.remove("show");
});
