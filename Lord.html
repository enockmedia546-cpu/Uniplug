<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIPLUG | Landlord Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --blue:#2563eb; --sky:#0ea5e9;
  --surface:rgba(255,255,255,0.04); --surface2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
  --text:#ffffff; --muted:#9ca3af; --label:#d1d5db;
  --error:#ef4444; --success:#10b981; --amber:#f59e0b;
  --sidebar-w:260px; --radius:14px;
}

body {
  background: radial-gradient(circle at 80% 10%,rgba(37,99,235,0.1),transparent 40%),
              radial-gradient(circle at 10% 90%,rgba(14,165,233,0.07),transparent 40%),
              linear-gradient(135deg,#000,#05070d,#0b1120);
  color:var(--text); font-family:'DM Sans',sans-serif;
  min-height:100vh; overflow-x:hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  position:fixed; top:0; left:0;
  width:var(--sidebar-w); height:100vh;
  background:rgba(5,7,13,0.97); border-right:1px solid var(--border);
  display:flex; flex-direction:column; z-index:100;
  transition:transform 0.3s; backdrop-filter:blur(20px);
}
.s-logo { padding:22px 20px; border-bottom:1px solid var(--border); font-family:'Syne',sans-serif; font-size:20px; font-weight:800; letter-spacing:2px; }
.s-logo span { color:var(--sky); }

.s-profile {
  padding:15px 20px; display:flex; align-items:center; gap:12px;
  border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.2s;
}
.s-profile:hover { background:var(--surface); }

.s-av {
  width:44px; height:44px; border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--sky));
  display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:700; flex-shrink:0; overflow:hidden;
  border:2px solid rgba(37,99,235,0.4);
}
.s-av img { width:100%; height:100%; object-fit:cover; }
.s-name { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.s-role { font-size:11px; color:var(--sky); margin-top:2px; }

.s-nav { flex:1; overflow-y:auto; padding:10px 0; }
.s-sec { font-size:10px; font-weight:600; letter-spacing:1.2px; color:var(--muted); text-transform:uppercase; padding:12px 20px 5px; }

.s-item {
  display:flex; align-items:center; gap:10px;
  padding:11px 20px; cursor:pointer; font-size:14px; color:var(--muted);
  border-left:3px solid transparent; transition:all 0.2s;
}
.s-item:hover { background:var(--surface); color:var(--text); }
.s-item.active { background:rgba(37,99,235,0.1); color:var(--text); border-left-color:var(--blue); }
.s-item i { width:18px; text-align:center; }
.s-tag { margin-left:auto; font-size:9px; font-weight:700; padding:2px 6px; border-radius:6px; background:rgba(14,165,233,0.15); color:var(--sky); text-transform:uppercase; }

.s-counter { margin-left:auto; font-size:11px; font-weight:700; color:var(--amber); }

.s-bottom { padding:14px 16px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
.s-btn { width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--muted); font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; transition:all 0.2s; text-align:left; display:flex; align-items:center; gap:8px; }
.s-btn:hover { color:var(--text); border-color:var(--border2); }
.s-btn.danger:hover { color:var(--error); border-color:var(--error); }

/* ── MAIN ── */
.main { margin-left:var(--sidebar-w); min-height:100vh; }

.topbar {
  position:sticky; top:0; background:rgba(5,7,13,0.9); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border); padding:0 28px; height:62px;
  display:flex; align-items:center; gap:16px; z-index:50;
}
.topbar-ham { display:none; background:none; border:none; color:var(--text); font-size:20px; cursor:pointer; }
.topbar-title { font-family:'Syne',sans-serif; font-size:17px; font-weight:700; flex:1; }
.topbar-av { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--sky)); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; overflow:hidden; cursor:pointer; }
.topbar-av img { width:100%; height:100%; object-fit:cover; }

.content { padding:28px; }

/* ── STAT CARDS ── */
.stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:24px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; transition:all 0.2s; position:relative; overflow:hidden; }
.stat-card::before { content:""; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--blue),var(--sky)); }
.stat-card:hover { border-color:var(--border2); transform:translateY(-2px); }
.stat-icon { font-size:20px; margin-bottom:8px; }
.stat-val  { font-family:'Syne',sans-serif; font-size:26px; font-weight:800; }
.stat-lbl  { font-size:11px; color:var(--muted); margin-top:2px; }

/* ── CARD ── */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px; margin-bottom:18px; }
.card-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.card-title { font-family:'Syne',sans-serif; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }

/* ── TABLE ── */
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th { padding:9px 14px; text-align:left; font-size:10px; font-weight:600; letter-spacing:0.8px; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); white-space:nowrap; background:rgba(0,0,0,0.15); }
tbody td { padding:13px 14px; border-bottom:1px solid rgba(255,255,255,0.03); vertical-align:middle; }
tbody tr:hover { background:rgba(255,255,255,0.02); }
tbody tr:last-child td { border-bottom:none; }
.td-acts { display:flex; gap:6px; flex-wrap:wrap; }

/* ── BADGES ── */
.badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:10px; font-weight:700; }
.b-green { background:rgba(16,185,129,0.12); color:#34d399; }
.b-red   { background:rgba(239,68,68,0.12);  color:#f87171; }
.b-blue  { background:rgba(37,99,235,0.12);  color:#60a5fa; }
.b-amber { background:rgba(245,158,11,0.12); color:#fbbf24; }
.b-gray  { background:rgba(156,163,175,0.1); color:#9ca3af; }

/* ── FORM ── */
.form-col { display:flex; flex-direction:column; gap:14px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.f-wrap { display:flex; flex-direction:column; gap:6px; }
label { font-size:13px; color:var(--label); font-weight:500; }

input, select, textarea {
  width:100%; padding:12px 14px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface);
  color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px;
  transition:border 0.2s; -webkit-appearance:none;
}
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,0.1); }
input::placeholder, textarea::placeholder { color:rgba(255,255,255,0.2); }
input:read-only { opacity:0.6; cursor:not-allowed; }
select option { background:#0d1b35; }
textarea { resize:vertical; min-height:80px; }
input.err, select.err { border-color:var(--error); }

/* ── BUTTONS ── */
.btn { padding:9px 16px; border-radius:9px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s; display:inline-flex; align-items:center; gap:6px; border:none; }
.btn-primary { background:linear-gradient(135deg,var(--blue),var(--sky)); color:white; box-shadow:0 4px 14px rgba(37,99,235,0.25); }
.btn-primary:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 18px rgba(37,99,235,0.35); }
.btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--muted); }
.btn-outline:hover { border-color:var(--border2); color:var(--text); }
.btn-danger  { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.25); color:var(--error); }
.btn-danger:hover  { background:rgba(239,68,68,0.18); }
.btn-success { background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.25); color:var(--success); }
.btn-sm { padding:6px 11px; font-size:11px; border-radius:7px; }

/* ── GENDER CHIPS ── */
.gender-chips { display:flex; gap:8px; }
.gender-chip {
  flex:1; padding:10px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface);
  color:var(--muted); font-family:'DM Sans',sans-serif; font-size:13px;
  cursor:pointer; text-align:center; transition:all 0.2s; font-weight:500;
}
.gender-chip:hover { border-color:rgba(59,130,246,0.4); color:var(--text); }
.gender-chip.active { background:rgba(37,99,235,0.15); border-color:var(--blue); color:#60a5fa; font-weight:700; }

/* ── AMENITY CHIPS ── */
.amenity-grid { display:flex; flex-wrap:wrap; gap:8px; }
.amenity-chip {
  padding:8px 14px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface);
  color:var(--muted); font-size:12px; cursor:pointer;
  display:flex; align-items:center; gap:6px;
  transition:all 0.2s; font-family:'DM Sans',sans-serif; font-weight:500;
}
.amenity-chip:hover { border-color:rgba(59,130,246,0.4); color:var(--text); }
.amenity-chip.active { background:rgba(37,99,235,0.12); border-color:var(--blue); color:#60a5fa; }
.amenity-chip i { font-size:13px; }

/* ── PHOTO UPLOAD ── */
.photo-upload-zone {
  border:2px dashed var(--border); border-radius:12px;
  padding:20px; text-align:center; cursor:pointer; transition:all 0.2s;
}
.photo-upload-zone:hover { border-color:rgba(37,99,235,0.5); background:rgba(37,99,235,0.04); }
.upload-icon { font-size:1.8rem; margin-bottom:6px; }
.upload-text { font-size:13px; color:var(--muted); }
.upload-hint { font-size:11px; color:rgba(255,255,255,0.2); margin-top:3px; }

.photo-preview-grid { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.photo-thumb-wrap { position:relative; width:90px; height:90px; }
.photo-thumb { width:90px; height:90px; border-radius:10px; object-fit:cover; border:1px solid var(--border); }
.photo-remove {
  position:absolute; top:-6px; right:-6px;
  width:22px; height:22px; border-radius:50%;
  background:var(--error); border:2px solid #0b1120;
  color:white; font-size:11px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.photo-limit-bar { margin-top:8px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
.photo-limit-dots { display:flex; gap:4px; }
.limit-dot { width:10px; height:10px; border-radius:50%; background:var(--border); transition:background 0.2s; }
.limit-dot.filled { background:var(--sky); }

/* ── UPLOAD PROGRESS ── */
.upload-progress-wrap { display:none; margin-top:10px; }
.upload-progress-bar-bg { height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.upload-progress-bar { height:100%; background:linear-gradient(90deg,var(--blue),var(--sky)); width:0%; transition:width 0.3s; }
.upload-progress-label { font-size:11px; color:var(--muted); margin-top:4px; }

/* ── LISTING CAP BANNER ── */
.cap-banner {
  background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.25);
  border-radius:12px; padding:14px 16px;
  display:flex; align-items:center; gap:10px;
  font-size:13px; color:var(--amber); margin-bottom:18px;
}

/* ── BRAND NAME SETUP ── */
.brand-setup-card {
  background:linear-gradient(135deg,rgba(37,99,235,0.08),rgba(14,165,233,0.06));
  border:1px solid rgba(37,99,235,0.2); border-radius:16px;
  padding:24px; text-align:center; margin-bottom:20px;
}
.brand-setup-card h3 { font-family:'Syne',sans-serif; font-size:17px; font-weight:700; margin-bottom:6px; }
.brand-setup-card p  { font-size:13px; color:var(--muted); margin-bottom:16px; }
.brand-input-row { display:flex; gap:10px; }
.brand-input-row input { flex:1; }

/* Expiry countdown */
.expiry-tag {
  display:inline-flex; align-items:center; gap:4px;
  font-size:10px; padding:3px 8px; border-radius:20px;
  background:rgba(245,158,11,0.1); color:var(--amber);
}
.expiry-tag.danger { background:rgba(239,68,68,0.1); color:var(--error); }

/* ── TENANT ── */
.tenant-row { display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--border); }
.tenant-row:last-child { border-bottom:none; }
.tenant-av { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--sky)); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
.tenant-info { flex:1; }
.tenant-name { font-size:14px; font-weight:600; }
.tenant-meta { font-size:12px; color:var(--muted); margin-top:2px; }
.pay-status.paid   { color:var(--success); }
.pay-status.unpaid { color:var(--error); }

/* ── EMPTY / SPINNER ── */
.empty-state { text-align:center; padding:48px 20px; color:var(--muted); }
.empty-state .ei { font-size:3rem; margin-bottom:12px; }
.empty-state h3  { font-size:15px; color:var(--label); margin-bottom:6px; }
.spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin 0.7s linear infinite; margin:40px auto; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── TOAST ── */
.toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(16px); padding:11px 22px; border-radius:50px; font-size:13px; font-weight:500; z-index:9999; opacity:0; pointer-events:none; transition:all 0.28s; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.error   { background:#dc2626; color:white; }
.toast.success { background:var(--success); color:white; }
.toast.info    { background:#1d4ed8; color:white; }
.toast.warn    { background:var(--amber); color:#000; }

/* ── MODAL ── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(8px); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:#090f1e; border:1px solid var(--border2); border-radius:20px; padding:26px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; position:relative; animation:mIn 0.22s ease; }
@keyframes mIn { from { opacity:0; transform:scale(0.96) translateY(8px); } to { opacity:1; transform:none; } }
.modal-close { position:absolute; top:14px; right:14px; background:var(--surface); border:1px solid var(--border); border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); font-size:13px; transition:all 0.2s; }
.modal-close:hover { color:var(--text); }
.modal-title { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; margin-bottom:4px; }
.modal-sub   { font-size:12px; color:var(--muted); margin-bottom:20px; }

/* ── CONFIRM BOX ── */
.confirm-box { background:rgba(239,68,68,0.05); border:1px solid rgba(239,68,68,0.15); border-radius:10px; padding:14px; font-size:13px; color:var(--label); line-height:1.6; margin-bottom:16px; }

/* Sidebar overlay */
.s-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:99; }

/* Profile big avatar */
.profile-big-av { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--sky)); display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; flex-shrink:0; overflow:hidden; cursor:pointer; position:relative; border:3px solid rgba(37,99,235,0.4); }
.profile-big-av img { width:100%; height:100%; object-fit:cover; }
.profile-big-av .av-overlay { position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; font-size:18px; }
.profile-big-av:hover .av-overlay { display:flex; }

@media (max-width:768px) {
  .sidebar { transform:translateX(-100%); }
  .sidebar.open { transform:translateX(0); }
  .s-overlay.show { display:block; }
  .main { margin-left:0; }
  .topbar-ham { display:block; }
  .content { padding:16px; }
  .form-row, .form-row-3 { grid-template-columns:1fr; }
  .stats-row { grid-template-columns:repeat(2,1fr); }
}
</style>
</head>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
  collection, query, where, orderBy, onSnapshot, serverTimestamp, getDocs, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ── Config ──────────────────────────────────────
const CLOUDINARY_CLOUD  = "dpm7avyrl";
const CLOUDINARY_PRESET = "Unplug";
const MAX_LISTINGS = 10;
const MAX_PHOTOS   = 3;
const LISTING_TTL_DAYS = 90; // auto-delete after 90 days

const app = initializeApp({
  apiKey: "AIzaSyAxwUZXw4YuOh6X29G9utuld-JtOTEhf0g",
  authDomain: "unplugin-f9afc.firebaseapp.com",
  projectId:  "unplugin-f9afc",
  storageBucket: "unplugin-f9afc.appspot.com"
});

const auth = getAuth(app);
const db   = getFirestore(app);

// ── State ────────────────────────────────────────
let currentUser  = null;
let userData     = null;
let pendingFiles = [];       // new files awaiting upload
let existingURLs = [];       // already-uploaded URLs for current form
let editingId    = null;     // id of listing being edited (null = new)
let listingCount = 0;        // live count of this landlord's listings
let selectedGender    = "any";

// ── Cloudinary upload ────────────────────────────
async function uploadToCloudinary(file, onProgress) {
  const fd = new FormData();
  fd.append("file", file);
  fd.append("upload_preset", CLOUDINARY_PRESET);
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`);
    xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100)); };
    xhr.onload = () => {
      const d = JSON.parse(xhr.responseText);
      d.secure_url ? resolve(d.secure_url) : reject(new Error(d.error?.message || "Upload failed"));
    };
    xhr.onerror = () => reject(new Error("Network error"));
    xhr.send(fd);
  });
}

// ── Auth Guard ───────────────────────────────────
onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = "../login.html"; return; }

// ── Auto-delete listings older than 90 days ──────
async function autoDeleteOldListings() {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - LISTING_TTL_DAYS);
  const cutoffTs = Timestamp.fromDate(cutoff);

  const q = query(collection(db,"listings"), where("ownerId","==",currentUser.uid));
  const snap = await getDocs(q);
  let deleted = 0;
  for (const d of snap.docs) {
    const created = d.data().createdAt;
    if (created && created.toDate() < cutoff) {
      await deleteDoc(d.ref);
      deleted++;
    }
  }
  if (deleted > 0) showToast(`${deleted} expired listing${deleted>1?"s":""} auto-removed.`, "info");
}

// ── Watch listing count ──────────────────────────
function watchListingCount() {
  const q = query(collection(db,"listings"), where("ownerId","==",currentUser.uid));
  onSnapshot(q, snap => {
    listingCount = snap.size;
    const badge = document.getElementById("listingCountBadge");
    if (badge) badge.textContent = `${listingCount}/${MAX_LISTINGS}`;
  });
}

// ── Amenity chips HTML ────────────────────────
function buildAmenityChips(selected = []) {
  const amenities = [
    { val:"wifi",      icon:"fas fa-wifi",       label:"Wi-Fi"    },
    { val:"water",     icon:"fas fa-tint",        label:"Water"    },
    { val:"power",     icon:"fas fa-bolt",        label:"Power"    },
    { val:"parking",   icon:"fas fa-car",         label:"Parking"  },
    { val:"security",  icon:"fas fa-shield-alt",  label:"Security" },
    { val:"furnished", icon:"fas fa-couch",       label:"Furnished"},
    { val:"wifi24",    icon:"fas fa-wifi",        label:"24/7 Wi-Fi"},
    { val:"water24",   icon:"fas fa-tint",        label:"24/7 Water"},
    { val:"borehole",  icon:"fas fa-water",       label:"Borehole" },
  ];
  return amenities.map(a => `
    <div class="amenity-chip ${selected.includes(a.val)?"active":""}"
         data-val="${a.val}" onclick="toggleAmenity(this)">
      <i class="${a.icon}"></i> ${a.label}
    </div>`).join("");
}

function buildAmenityIcons(amenities = []) {
  const iconMap = { wifi:"📶", water:"💧", power:"⚡", parking:"🚗", security:"🔒", furnished:"🛋️", wifi24:"📶", water24:"💧", borehole:"🌊" };
  return amenities.slice(0,5).map(a => iconMap[a]||"").join("");
}

window.toggleAmenity = function(el) {
  const val = el.dataset.val;
  el.classList.toggle("active");
  if (el.classList.contains("active")) {
    if (!selectedAmenities.includes(val)) selectedAmenities.push(val);
  } else {
    selectedAmenities = selectedAmenities.filter(a => a !== val);
  }
};

// ── Photo handling ─────────────────────────────
window.triggerPhotoInput = function() {
  const total = existingURLs.length + pendingFiles.length;
  if (total >= MAX_PHOTOS) { showToast(`Maximum ${MAX_PHOTOS} photos allowed.`, "warn"); return; }
  document.getElementById("photoInput")?.click();
};

window.handlePhotoSelect = function(e) {
  const files = Array.from(e.target.files);
  const remaining = MAX_PHOTOS - existingURLs.length - pendingFiles.length;
  const toAdd = files.slice(0, remaining);

  if (files.length > remaining)
    showToast(`Only ${remaining} more photo${remaining!==1?"s":""} allowed.`, "warn");

  toAdd.forEach(file => {
    pendingFiles.push(file);
    const reader = new FileReader();
    reader.onload = ev => {
      const previews = document.getElementById("photoPreviews"); if (!previews) return;
      const idx = pendingFiles.length - 1;
      const wrap = document.createElement("div");
      wrap.className = "photo-thumb-wrap"; wrap.id = `pend-${idx}`;
      wrap.innerHTML = `<img src="${ev.target.result}" class="photo-thumb">
        <button class="photo-remove" onclick="removePending(${idx})">✕</button>`;
      previews.appendChild(wrap);
      updatePhotoUI();
    };
    reader.readAsDataURL(file);
  });

  e.target.value = "";
};

window.removeExisting = function(i) {
  existingURLs.splice(i, 1);
  renderAddEdit(editingId); // re-render
};

window.removePending = function(i) {
  pendingFiles.splice(i, 1);
  const el = document.getElementById(`pend-${i}`); if (el) el.remove();
  updatePhotoUI();
};

function updatePhotoUI() {
  const total = existingURLs.length + pendingFiles.length;
  [0,1,2].forEach(i => {
    const dot = document.getElementById(`dot-${i}`);
    if (dot) dot.classList.toggle("filled", i < total);
  });
  const lbl = document.getElementById("photoCountLabel");
  if (lbl) lbl.textContent = `${total}/${MAX_PHOTOS} photos`;
  const zone = document.getElementById("photoZone");
  if (zone) { zone.style.opacity = total >= MAX_PHOTOS ? "0.4" : "1"; zone.style.pointerEvents = total >= MAX_PHOTOS ? "none" : "auto"; }
}

  // Validation
  let ok = true;
  [["lArea",!area],["lDist",!dist],["lPrice",!price],["lBeds",!bedspaces],["lPerRoom",!perRoom]].forEach(([id,bad]) => {
    document.getElementById(id)?.classList.toggle("err", bad);
    if (bad) ok = false;
  });
  if (!ok) { showToast("Please fill in all required fields.", "warn"); return; }

  const btn = document.getElementById("saveListingBtn");
  btn.disabled = true; btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Saving...`;

  // Upload pending photos to Cloudinary
  const progressWrap = document.getElementById("uploadProgressWrap");
  const progressBar  = document.getElementById("uploadProgressBar");
  const progressLbl  = document.getElementById("uploadProgressLabel");
  if (progressWrap) progressWrap.style.display = "block";

  let photos = [...existingURLs];
  for (let i = 0; i < pendingFiles.length; i++) {
    if (progressLbl) progressLbl.textContent = `Uploading photo ${i+1} of ${pendingFiles.length}...`;
    const url = await uploadToCloudinary(pendingFiles[i], pct => {
      if (progressBar) progressBar.style.width = pct + "%";
    });
    photos.push(url);
    if (progressBar) progressBar.style.width = "0%";
  }

  if (progressWrap) progressWrap.style.display = "none";

  const data = {
    brandName:   userData.landlordBrandName,
    area, distance: dist, price, bedspaces, perRoom,
    description: desc, available,
    gender:      selectedGender,
    amenities:   selectedAmenities,
    photos,
    ownerId:     currentUser.uid,
    ownerName:   userData.fullName,
    ownerPhone:  userData.landlordPhone || userData.phone || "",
    updatedAt:   serverTimestamp()
  };

  try {
    if (editingId) {
      await updateDoc(doc(db,"listings",editingId), data);
      showToast("Listing updated! ✅", "success");
    } else {
      data.createdAt = serverTimestamp();
      await addDoc(collection(db,"listings"), data);
      showToast("Listing created! 🎉", "success");
    }
    pendingFiles = []; existingURLs = [];
    go("listings");
  } catch(err) {
    showToast("Error: " + err.message, "error");
    btn.disabled = false;
    btn.innerHTML = `<i class="fas fa-save"></i> ${editingId?"Save Changes":"Create Listing"}`;
  }
};

async function renderTenants() {
  set(`
    <div style="margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div>
        <h2 style="font-family:'Syne',sans-serif;font-size:20px;font-weight:800;">Tenants & Payments</h2>
        <p style="font-size:13px;color:var(--muted);margin-top:2px;">Track your tenants and rent payments</p>
      </div>
      <button class="btn btn-primary" onclick="openAddTenantModal()"><i class="fas fa-user-plus"></i> Add Tenant</button>
    </div>

    <div id="tenantCards"><div class="spinner"></div></div>`);

  const q = query(collection(db,"tenants"), where("landlordId","==",currentUser.uid));
  onSnapshot(q, snap => {
    const el = document.getElementById("tenantCards"); if (!el) return;
    if (!snap.docs.length) {
      el.innerHTML = `<div class="empty-state"><div class="ei"><i class="fas fa-users"></i></div><h3>No tenants yet</h3>
        <button class="btn btn-primary" onclick="openAddTenantModal()"><i class="fas fa-user-plus"></i> Add Tenant</button></div>`;
      return;
    }
    const byListing = {};
    snap.docs.forEach(d => {
      const t = { id:d.id, ...d.data() };
      const key = t.listingName || "Other";
      if (!byListing[key]) byListing[key] = [];
      byListing[key].push(t);
    });

    el.innerHTML = Object.entries(byListing).map(([listing, tenants]) => `
      <div class="card" style="margin-bottom:14px;">
        <div class="card-hdr">
          <div class="card-title"><i class="fas fa-home"></i> ${esc(listing)}</div>
          <span class="badge b-blue">${tenants.length} tenant${tenants.length!==1?"s":""}</span>
        </div>
        ${tenants.map(t => `
          <div class="tenant-row">
            <div class="tenant-av">${esc((t.name||"?").slice(0,2).toUpperCase())}</div>
            <div class="tenant-info">
              <div class="tenant-name">${esc(t.name||"Unknown")}</div>
              <div class="tenant-meta">📱 ${esc(t.phone||"—")} · Room ${esc(t.room||"?")} · Bed ${esc(t.bed||"?")}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
              <div class="pay-status ${t.paid?"paid":"unpaid"}">${t.paid?"🔒 Paid":"🔓 Unpaid"}</div>
              <div style="display:flex;gap:6px;">
                <button class="btn btn-sm ${t.paid?"btn-danger":"btn-success"}" onclick="togglePayment('${t.id}',${t.paid})">
                  ${t.paid?"Mark Unpaid":"Mark Paid"}
                </button>
                <button class="btn btn-danger btn-sm" onclick="removeTenant('${t.id}')"><i class="fas fa-trash"></i></button>
              </div>
            </div>
          </div>`).join("")}
      </div>`).join("");
  });
}

window.saveTenant = async function() {
  const name  = document.getElementById("tName")?.value?.trim();
  const phone = document.getElementById("tPhone")?.value?.trim();
  if (!name||!phone) { showToast("Name and phone required."); return; }
  await addDoc(collection(db,"tenants"), {
    landlordId: currentUser.uid, name, phone,
    listingName: document.getElementById("tListing")?.value||"",
    room:  document.getElementById("tRoom")?.value?.trim()||"",
    bed:   document.getElementById("tBed")?.value?.trim()||"",
    dueDate: document.getElementById("tDue")?.value||"",
    paid: document.getElementById("tPaid")?.value==="true",
    createdAt: serverTimestamp()
  });
  closeModal(); showToast("Tenant added! ✅","success");

window.togglePayment = async function(id, current) {
  await updateDoc(doc(db,"tenants",id), { paid: !current });
  showToast(!current ? "Marked as paid 🔒":"Marked as unpaid 🔓","success");
};

window.removeTenant = async function(id) {
  if (!confirm("Remove this tenant?")) return;
  await deleteDoc(doc(db,"tenants",id)); showToast("Removed.","info");
};

window.saveBrandName = async function() {
  const brand = document.getElementById("brandInput")?.value?.trim();
  if (!brand) { showToast("Brand name cannot be empty."); return; }
  await updateDoc(doc(db,"users",currentUser.uid), { landlordBrandName: brand });
  userData.landlordBrandName = brand;

  // Also update all existing listings with new brand name
  const snap = await getDocs(query(collection(db,"listings"), where("ownerId","==",currentUser.uid)));
  for (const d of snap.docs) await updateDoc(d.ref, { brandName: brand });

  showToast(`Brand name set to "${brand}" ✅`, "success");
  renderProfile();
};

window.saveProfile = async function() {
  const upd = {
    firstName: document.getElementById("eFirst")?.value?.trim(),
    lastName:  document.getElementById("eLast")?.value?.trim(),
    phone:     document.getElementById("ePhone")?.value?.trim(),
    landlordPhone: document.getElementById("eLandlordPhone")?.value?.trim(),
  };
  upd.fullName = `${upd.firstName} ${upd.lastName}`.trim();
  await updateDoc(doc(db,"users",currentUser.uid), upd);
  Object.assign(userData, upd);
  document.getElementById("sName").textContent = upd.fullName;
  showToast("Profile updated! ✅","success");
  renderProfile();
};

window.uploadAvatar = async function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const btn = document.querySelector(".profile-big-av");
    if (btn) btn.innerHTML = `<img src="${ev.target.result}"><div class="av-overlay"><i class="fas fa-camera"></i></div>`;
  };
  reader.readAsDataURL(file);

  document.getElementById("avUploadWrap").style.display = "block";
  document.getElementById("avUploadStatus").textContent = "Uploading...";

  try {
    const url = await uploadToCloudinary(file, pct => {
      document.getElementById("avUploadBar").style.width = pct+"%";
    });
    await updateDoc(doc(db,"users",currentUser.uid), { photoURL: url });
    userData.photoURL = url;
    updateUI();
    document.getElementById("avUploadStatus").textContent = "✅ Photo updated!";
    setTimeout(() => {
      document.getElementById("avUploadWrap").style.display = "none";
      document.getElementById("avUploadStatus").textContent = "";
    }, 2500);
    showToast("Photo updated! ✅","success");
  } catch(err) {
    document.getElementById("avUploadStatus").textContent = "❌ Upload failed.";
    showToast("Upload failed: "+err.message,"error");
  }
  e.target.value = "";
};

// ══════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════
function expiryDays(createdAt) {
  if (!createdAt) return LISTING_TTL_DAYS;
  const expiresAt = new Date(createdAt.getTime() + LISTING_TTL_DAYS * 86400000);
  return Math.max(0, Math.ceil((expiresAt - Date.now()) / 86400000));
}

function genderColor(gender) {
  const map = { male:"b-blue", female:"b-amber", female:"b-amber", mixed:"b-green" };
  return map[(gender||"").toLowerCase()] || "b-gray";
}

function ibox(label, val) {
  return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px;">
    <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">${label}</div>
    <div style="font-size:14px;font-weight:600;">${val}</div>
  </div>`;
}

function qcard(icon, label, section) {
  return `<div onclick="go('${section}')" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all 0.2s;"
    onmouseover="this.style.borderColor='rgba(59,130,246,0.4)';this.style.transform='translateY(-2px)'"
    onmouseout="this.style.borderColor='var(--border)';this.style.transform='none'">
    <i class="${icon}" style="font-size:24px;color:var(--sky);margin-bottom:8px;display:block;"></i>
    <div style="font-size:12px;font-weight:600;">${label}</div>
  </div>`;
}

function set(html) { document.getElementById("mainContent").innerHTML = html; }

function initials(name="U") {
  return (name).split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
}

function esc(str="") {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function timeAgo(date) {
  if (!date) return "";
  const s = Math.floor((Date.now()-date.getTime())/1000);
  if (s<60) return "just now"; if (s<3600) return `${Math.floor(s/60)}m ago`;
  if (s<86400) return `${Math.floor(s/3600)}h ago`; return `${Math.floor(s/86400)}d ago`;
}

window.showToast = function(msg, type="error") {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = `toast show ${type}`;
  setTimeout(() => t.className = "toast", 3200);
};

window.openModal = function(html) {
  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("modalOverlay").classList.add("show");
};

window.closeModal = function() {
  document.getElementById("modalOverlay").classList.remove("show");
};

window.toggleSidebar = function() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sOverlay").classList.toggle("show");
};

window.closeSidebar = function() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sOverlay").classList.remove("show");
};

  window.location.href = "login.html";
};
